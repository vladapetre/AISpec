# In-artifact markers and identifier prefixes. Index lives in tokens.yaml.
#
# Markers are status / quality annotations — not routing. Identifier prefixes are typed
# cross-artifact ID vocabulary. Cross-artifact refs take the form `<short-title>#<ID>`
# (short-title = host filename without `.md`, without numeric prefix for ADRs/SDRs).

in_artifact_markers:
  - "<!-- status:phase-N --> — architect writes the per-phase anchor in plan files."
  - "**Status: Complete** — developer inserts after a phase anchor on user approval."
  - "[IRREVERSIBLE] — architect / consultant mark hard-to-reverse decisions; triggers extra user confirm."
  - "[PRE-EXISTING] — developer / reviewer mark failures/findings not introduced by the current phase; excluded from verdict."
  - "[VERIFIED] / [INFERRED] / [ASSUMED] — analyst per-finding confidence markers (definitions in documenting SKILL.md)."
  - "[ASSUMPTION] — analyst coverage/scoping caveat in Risks and Unknowns."
  - "[UNKNOWN] — analyst: a required question left unanswered after full ingestion; architect (A9b): a load-bearing assumption downgraded into the plan with a named fallback."
  - "[withdrawn] — appended to an ID-led line whose entry no longer applies. ID stays in place — never re-number."
  - "**Spec: ON HOLD — <reason>, <date>** — team lead inserts beneath a plan title while the governing spec is renegotiated (CLAUDE.md ## Spec volatility, Source A); developer pre-flight marks Inputs ⚠ while present; removed when the settled deltas are absorbed by ONE amendment. Source B (user design rulings) uses a lead-held queue, not this stamp — the plan is not held."
  - "### D-### (rN) — revision marker on a design record decision heading (no marker = r1; markers only increase). Bumped by Amendment mode M3 together with a `## Revision log` line; lint.write bounces a body edit missing either. The record's presence/absence of a `## Decisions` section is also the artifact-model detector everywhere (record vs legacy pair)."
  - "**Governing ADR:** — LEGACY-PAIR marker (a design record never carries it — its absence is the model detector). Architect wrote it in the plan header; legacy Amendment mode repoints it at the supersession or consolidation. It is the reviewer's FIRST resolution step for the legacy effective ADR (perphase step 7, crosscheck CC-2a) — the glob fallback exists only for plans that predate it."
  - "**Supersedes:** / **Superseded by:** — legacy pairs only: architect (Amendment mode ## Legacy pairs) pairs these on every supersession: the new ADR lists what it replaces, each replaced file carries one stamp beneath its title. A consolidation lists the whole chain and stamps every file in it."
  - "**Consolidates: <N> revisions** — legacy pairs only (Amendment mode M2b): marks a re-issued ADR that folded a delta chain at r3+. Its retired decisions are listed once under `## Superseded decisions`; D-### numbers are preserved so plan phases and prior review records still resolve."

identifier_prefixes:
  - { prefix: "R-",    format: "R-###",          produced_by: analyst,             host: "reports/<title>.md",            in: "Each finding bullet in `### theme` subsection. Severity-tagged." }
  - { prefix: "D-",    format: "D-###",          produced_by: "architect, consultant", host: "plans/ (design records), adr/, strategy/decisions/", in: "Design record: every `### D-###` heading under `## Decisions`. Legacy ADR: sub-decision bullet in `## Decision` (only when the ADR has multiple decisions)." }
  - { prefix: "RISK-", format: "RISK-###",       produced_by: "architect, consultant", host: "plans/ (design records), adr/, strategy/decisions/", in: "Design record: `**Risks:**` bullets inside a decision. Legacy ADR: `## Consequences > Risks` bullets. Severity-tagged." }
  - { prefix: "T-",    format: "T-<phase>.<seq>", produced_by: architect,    host: "plans/<title>.md",              in: "Bullets under each phase's `**Done when:**`. Phase-namespaced so adding/removing phases does not renumber unrelated phases." }
  - { prefix: "OQ-",   format: "OQ-###",         produced_by: "architect, consultant", host: "plans/, charters/", in: "`## Open Questions` / `## Open questions` bullets." }
  - { prefix: "TF-",   format: "TF-###",         produced_by: consultant,  host: "strategy/decisions/",           in: "`## Tactical follow-up` bullets, each led by `**TF-###** [TACTICAL DESIGN NEEDED]`. architect cites these in tactical ADR `## Context`." }
  - { prefix: "INV-",  format: "INV-###",        produced_by: consultant,  host: "strategy/charters/",            in: "`## Invariants` bullets. Cited by SDRs constraining the context and by reviewer checking design-intent alignment." }
  - { prefix: "REL-",  format: "REL-###",        produced_by: consultant,  host: "strategy/context-maps/",        in: "First column of `## Relationships` rows. Cited by SDRs changing the relationship pattern." }
  - { prefix: "X-",    format: "X-###",          produced_by: reviewer,  host: "(conversation channel only)",   in: "Cross-check output table. Resets per pass — IDs do not survive across passes. Severity-tagged." }

identifier_rules:
  - "Assign IDs in encounter order at first write; dense at first write, sparse after edits."
  - "Never re-number a published ID. Withdraw by appending `[withdrawn]`."
  - "Amending an artifact: next integer after the high-water mark — never reuse withdrawn numbers."
  - "Cross-artifact refs: `<short-title>#<ID>` (short-title = host filename without `.md`, without numeric prefix for ADRs/SDRs)."
  - "Severity-tagged prefixes carry `[critical | major | minor | pre-existing]` in brackets after the ID — values per the template's severity table, never paraphrased."
