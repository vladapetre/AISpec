# MAST — Multi-Agent failure taxonomy and design rules.
#
# Source: Cemri et al., "Why Do Multi-Agent LLM Systems Fail?", arXiv:2503.13657v2.
#
# Status: designer's reference, not a runtime asset. This file is read when designing,
# reviewing, or amending the harness — not loaded into agent prompts. Each agent ends
# its <instructions> with a closing self-check that captures the active FMs in plain
# language; inline `**Avoid (FM-x.x):**` cues are no longer scattered through prompts.

meta_principle: >
  Prompt tweaks alone do not fix multi-agent failures. Tactical fixes give marginal
  gains; reliability comes from structural changes — verification layers, defined
  protocols, explicit state handling.

  True determinism is impossible (LLMs are stochastic). The achievable goal is low
  variance + high accuracy. Most harmful non-determinism is under-specification, not
  model randomness — tightening structure makes runs converge.

# The 14 failure modes, grouped into 3 categories.
taxonomy:
  system_design:
    - { code: FM-1.1, name: Insufficient Context Provision }
    - { code: FM-1.2, name: Disobey Role Specification }
    - { code: FM-1.3, name: Premature Termination }
    - { code: FM-1.4, name: Loss of Conversation History }
    - { code: FM-1.5, name: Unaware of Stopping Conditions }
  inter_agent_misalignment:
    - { code: FM-2.1, name: Step Repetition }
    - { code: FM-2.2, name: Conversation Reset }
    - { code: FM-2.3, name: Conflicting Tool Use }
    - { code: FM-2.4, name: Ineffective Delegation }
    - { code: FM-2.5, name: Misaligned Agent Objectives }
  task_verification:
    - { code: FM-3.1, name: Incorrect Output Format }
    - { code: FM-3.2, name: Incomplete Information Delivery }
    - { code: FM-3.3, name: Inaccurate Task Execution }
    - { code: FM-3.4, name: Ineffective Task Understanding }

# The 14 design rules. Each maps to one or more failure modes.
design_rules:
  - { id: R1,  fms: [FM-1.1],         title: "Give each agent its full context explicitly",   rule: "Pass relevant artifacts into the prompt directly; do not assume inheritance." }
  - { id: R2,  fms: [FM-1.2],         title: "Pin roles hard, and keep them narrow",          rule: "State what the agent must and must not do. Overlapping mandates cause drift." }
  - { id: R3,  fms: [FM-1.3, FM-1.5], title: "Define explicit stopping conditions",           rule: "Every agent needs a concrete 'done' definition and a 'not done until X' guard." }
  - { id: R4,  fms: [FM-1.4],         title: "Make conversation history durable",             rule: "Persist decisions in artifacts, not just chat. Transient state gets lost across handoffs." }
  - { id: R5,  fms: [FM-2.4],         title: "Make delegation contracts explicit",            rule: "A handoff specifies: task, inputs, expected output shape, acceptance criteria." }
  - { id: R6,  fms: [FM-2.5],         title: "Single shared source of truth for goals",       rule: "All agents reference the same plan/charter. Re-deriving objectives causes drift." }
  - { id: R7,  fms: [FM-2.1],         title: "Detect and break repetition loops",             rule: "Track re-doing without new result; cap iterations." }
  - { id: R8,  fms: [FM-2.3],         title: "Standardise tool/interface protocols",          rule: "Same tool names, same I/O conventions across agents." }
  - { id: R9,  fms: [FM-2.2],         title: "Never reset context mid-task",                  rule: "Resume agents with full history rather than spawning fresh ones." }
  - { id: R10, fms: [FM-3.3],         title: "Dedicated verifier — never self-certify",       rule: "A separate reviewer is the single most effective intervention." }
  - { id: R11, fms: [FM-3.1],         title: "Verify output format, not just content",        rule: "Check the output matches the schema the next agent expects." }
  - { id: R12, fms: [FM-3.3],         title: "Checklist-driven verification, not vibes",      rule: "Generic 'review this' misses things; concern-specific checklists catch more." }
  - { id: R13, fms: [FM-3.4, FM-3.2], title: "Force task restatement before execution",       rule: "Have the agent paraphrase requirements and success criteria first." }
  - { id: R14, fms: [FM-3.3, FM-3.4], title: "Decompose into independently verifiable subtasks", rule: "Each subtask gets explicit success criteria, checked on its own." }

# Audit checklist for an agent definition — each item maps to a design rule.
# Use this when designing or amending an agent file.
audit_checklist:
  - { rule: R1,  check: "Does the prompt pass all needed context/artifacts explicitly?" }
  - { rule: R2,  check: "Are both role AND anti-role (must-not-do) stated?" }
  - { rule: R3,  check: "Is there a concrete, testable 'done' condition?" }
  - { rule: R4,  check: "Are decisions persisted to artifacts, not just chat?" }
  - { rule: R5,  check: "Do handoffs specify task + inputs + output shape + acceptance?" }
  - { rule: R6,  check: "Do all agents point to one canonical goal statement?" }
  - { rule: R7,  check: "Is there an iteration / retry cap?" }
  - { rule: R8,  check: "Are tool conventions standardised across agents?" }
  - { rule: R9,  check: "Are agents resumed rather than re-spawned?" }
  - { rule: R10, check: "Is there an independent verifier (not the producer)?" }
  - { rule: R11, check: "Is output format validated at each handoff?" }
  - { rule: R12, check: "Is verification checklist-driven?" }
  - { rule: R13, check: "Does the agent restate / self-check the task before emitting?" }
  - { rule: R14, check: "Is the work decomposed into verifiable subtasks?" }

# How MAST stays load-bearing in the harness:
# 1. Designer's lens — this file. Used when authoring or amending agent/skill files.
# 2. Closing self-check — each agent's <instructions> ends with a 4–6 bullet block that
#    captures the active FMs in plain language for that role. The bullets reference
#    the rules above by intent, not by FM code.
# 3. Structural mechanisms — output formats, flag tokens, templates, typed IDs,
#    diff-size gating, dual approval gates. These embody R5/R11/R10/R12/R14 in
#    architecture rather than prompt text.
