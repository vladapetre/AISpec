# Output-brief registry: how much of a contract block reaches the terminal.
#
# Why this exists. Every `## Output format` in this harness said "emit exactly"
# or "always render every block; use `_None_` for empty lists", so a two-file
# phase cost the reader the same ~25 lines as a twelve-file one, and a clean
# review still rendered four empty severity headings plus five metadata fields.
# Block length tracked the TEMPLATE, not the content. CLAUDE.md
# `## Pre-flight protocol` already carried the fix in miniature (every check is
# a tick, collapsing to one line; any warning expands), and this file
# generalises that branch to every output block.
#
# What does NOT change: the block's shape. Headings, field labels, and the final
# verdict or routing line are matched as exact strings by guard.verdict.mjs, and
# `## Turn discipline` still sends exactly one block per turn. What changes is
# which fields are rendered at all.
#
# Each mode file's `## Output format` references its key here as
# `brief.yaml#<key>` instead of restating the rules. `guard.brief.mjs`
# (Stop / SubagentStop) enforces nil_collapse and the per-key cap.
# Keys: <agent> for a single-mode agent, <agent>-<mode> otherwise.

rules:
  answer_first: >
    The first line under the heading is the answer in one sentence: the verdict,
    the recommendation, the decision, what was built. Reasoning follows it and
    never precedes it. A reader who stops after that line still knows the
    outcome. This replaces the "<one-paragraph summary>" opener the blocks used
    to carry, because a paragraph is not a first line.

  nil_collapse: >
    A field whose value would be `_None_`, `(none)`, `_N/A_`, or an empty list is
    NOT rendered. Name every omitted field once, in output order, on a single
    closing line: `Nil: <field>, <field>, ...`. Omit that line too when nothing
    was nil. The always-render rule existed to prove a field was considered
    rather than forgotten; one line proves it exactly as well as eight did.
    Fields listed under a key's `always:` are exempt. A field the current mode
    never renders (section 2b outside a cumulative review) is absent, not nil,
    and is not named on the line.

  always: >
    Render these verbatim on every emission, populated or not, even when the rest
    of the block collapses to nothing. They are the gate itself: the user's
    decision, or a downstream agent's pre-flight, reads off them.

  machine_consumed: >
    A field another agent resolves in its own pre-flight (plan path, phase
    number, commit range, record path, changed-file union) stays in the block
    even when the human skims past it. Compress those onto one line; never drop
    one to save a line. The reviewer cannot review a range it was not given.

  detail_to_artifact: >
    Tables, per-finding bodies, evidence rows, and long enumerations go to the
    key's `detail:` file, which is written anyway. The block keeps the counts,
    the blocking items, and ONE pointer line. Machine metadata that no agent
    consumes (input basis, template lists, read scope, gate size, detected
    frameworks) is for the record rather than the reader: it lives in the detail
    file and leaves the block entirely.

  cap: >
    Soft line budget for the block, counting non-empty lines. Over budget means
    move detail into the `detail:` file. It never means dropping a finding, a
    blocking item, or an `always:` field. Lines carrying Critical or Major
    findings, and the `always:` fields, do not count against it.

  expansion: >
    Never pre-render detail in case it is wanted. The emitting instance still
    holds the full analysis, so "expand section 3" or "show the full review" is a
    continuation turn costing one round trip (CLAUDE.md `## Agent lifecycle`).
    The pointer line is the offer; do not pre-empt it.

  reason_survives: >
    Concision is not the removal of reasoning, and this is the rule the others
    serve. Every retained line states its because:
    "FAIL - T-3.2: the retry swallows the 409 (Client.cs:88)", never
    "FAIL - T-3.2". Cutting the ceremony is the goal; cutting the argument is the
    failure mode. When a line cannot carry its reason in the space available, the
    reason wins and the line runs long.

# Key = the agent's `name:` frontmatter value, plus the mode where one exists.

analyst:
  cap: 10
  always: ["Confidence:"]
  detail: "artifacts/reports/<short-title>.md (the report is the long form; the block is its abstract)"
  notes: >
    The block names the top findings in one sentence each with their confidence
    marker, not the finding set. Ticketing tasks: issue key, URL, and what
    changed, one line per issue.

architect-design:
  cap: 10
  always: ["Design record:", "Thresholds:"]
  detail: "the design record itself (input basis, alternatives, rejected options, phase bodies)"
  notes: >
    `Inputs:` collapses to the report path alone; the basis parenthetical
    (explicit reference / sole file / lex-sort tiebreak) is audit metadata and
    belongs in the record. `Thresholds:` stays because it shows the arithmetic
    behind the final routing line.

architect-amendment:
  cap: 12
  always: ["Record:", "Classification:"]
  detail: "the record's `## Revision log` line (what changed and why) plus the revised D-### bodies"
  notes: >
    Per the Classification field rules, whole groups of fields read
    `_N/A - CODE_DRIFT_`; those collapse to the Nil line, and the classification
    itself already tells the reader which group went.

consultant-discussion:
  cap: 20
  always: ["Recommendation:"]
  detail: "none - the reasoning IS the deliverable here; cap the ceremony, never the argument"
  notes: >
    The one block where prose is the product, so the cap is generous and covers
    the footer rather than the body. `Recommendation:` moves to the TOP, above
    the reasoning, per answer_first. The "Want this ratified?" offer renders only
    when something ratifiable was actually reached.

consultant-artifact:
  cap: 10
  always: ["Binding constraints:"]
  detail: "the SDR / charter / context map written this turn"

developer-implement:
  cap: 18
  always: ["**Tests:**", "**Linter:**", "**Verification:**", "Requesting approval from: USER", "**Run offer:**"]
  detail: ".claude/agent-memory/developer/plan-<short-title>.md (the per-plan progress file, written at step 11 anyway)"
  notes: >
    `**Verification:**` is exempt from every collapse: CLAUDE.md
    `## Implementation Review` makes it the phase gate, and guard.verdict.mjs
    checks it against observed drive evidence. `**Plan:**` and `**Commit range:**`
    merge onto one machine_consumed line (the reviewer's pre-flight needs both).
    The standing parenthetical about when the reviewer runs is contract, not
    news, and leaves the block. Changed files over five: name five and count the
    rest, with the full list in the progress file.

developer-rejection:
  cap: 18
  always: ["**Tests:**", "**Linter:**", "**Verification:**", "Requesting approval from: USER"]
  detail: ".claude/agent-memory/developer/plan-<short-title>.md"
  notes: >
    Re-emits the implement block, so its budget governs. The `## Phase N Stalled`
    block caps at 8: it is four fields and a diagnosis, and a stall is read under
    pressure.

reviewer-perphase:
  cap: 18
  always: ["**Alignment:**", "**Code review:**", "Reason:"]
  detail: "review-<plan-stem>-<phaseN|cumulative>-<YYYY-MM-DD>.md in reviewer memory (step 16 writes it on any findings-bearing pass; the four section tables live there in full)"
  notes: >
    The largest saving in the harness: the four section tables, the machine
    metadata (frameworks, concerns, templates applied, gate size, read scope),
    and the Minor and Pre-existing findings all move to the per-review file. The
    block keeps the verdict lines, every Critical and Major finding with its
    file:line and the failure it causes, the reason, and the pointer. A clean
    APPROVED is five lines and writes no file, because there is nothing to file.

reviewer-crosscheck:
  cap: 14
  always: ["**Scope:**", "**Findings:**"]
  detail: "review-<stem>-crosscheck[-rN|-consolidated]-<date>.md per CC-6, on any findings-bearing pass"
  notes: >
    Findings rows stay inline while they fit the cap (a drift row is the reason
    the pass ran); past it, the table moves to the CC-6 file and the block keeps
    the counts by severity plus every critical row. `**Model:**` and `**Inputs:**`
    collapse into the Scope line.
