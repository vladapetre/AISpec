# Verdict tokens — gate decisions. Matched as exact strings. Index lives in tokens.yaml.
#
# Phase-approval gate: every phase needs the user's `approved`. Reviewer's APPROVED is
# cumulative at end-of-plan unless the user asks for ad-hoc per-phase review.
# Cross-check gate fires per design before Phase 1 (full pass) when an A13 threshold
# trips (≥4 phases, security path, [IRREVERSIBLE], schema/migration), and after
# amendments (delta pass) when an M5a condition holds; SELF_CHECKED / SELF_CHECKED
# (delta) record the no-threshold outcome. The check is decisions↔phases inside a
# design record, or plan↔ADR on a legacy pair.

verdict_tokens:
  - token: "APPROVED"
    issued_by: reviewer
    gate: "end-of-plan cumulative review; mandatory mid-plan checkpoints (CLAUDE.md ## Implementation Review); ad-hoc per-phase on user request"
    effect: "Phase / plan passes the reviewer gate."

  - token: "CHANGES REQUIRED"
    issued_by: reviewer
    gate: "end-of-plan cumulative review; mandatory mid-plan checkpoints (CLAUDE.md ## Implementation Review); ad-hoc per-phase on user request"
    effect: "Phase / plan returns to the developer — unless the verdict reason names plan ambiguity (UNCLEAR rows), which routes to the architect instead."

  - token: "approved"
    match: case-insensitive
    issued_by: "user (relayed by team lead)"
    gate: "phase-approval gate — every phase"
    effect: "Developer advances to the next phase."

  - token: "ALIGNED"
    issued_by: reviewer
    gate: "cross-check gate (architect CROSS_CHECK_REQUESTED, or user /cross-check)"
    effect: "The design is internally consistent (record decisions↔phases, or legacy ADR↔plan); developer may start Phase 1."

  - token: "DRIFT DETECTED"
    issued_by: reviewer
    gate: "cross-check gate (architect CROSS_CHECK_REQUESTED, or user /cross-check)"
    effect: "The design has critical/major internal drift; architect reconciles (Amendment mode via ARCHITECT AMENDMENT NEEDED:)."
