# Routing tokens — move work between agents. Index lives in tokens.yaml.
#
# Disambiguation: analyst's report-side and architect's ADR-side flags both use the
# "ARCHITECT REVIEW NEEDED" wording but in different artifacts. In-artifact form is
# bracketed `[...]`; conversation form is the summary-line prefix `...:`.

routing_tokens:
  - token: "[ARCHITECT REVIEW NEEDED]"
    summary_line: "ARCHITECT REVIEW NEEDED:"
    produced_by: analyst
    written_into: "Report Recommendations + summary line"
    consumed_by: architect
    meaning: "A finding needs tactical architectural input."

  - token: "[CONSULTANT REVIEW NEEDED]"
    summary_line: "STRATEGIC REVIEW NEEDED:"
    produced_by: analyst
    written_into: "Report Recommendations + summary line"
    consumed_by: consultant
    meaning: "A finding needs strategic input. Discussion may precede ratification."

  - token: "[STRATEGIC REVIEW NEEDED]"
    produced_by: architect
    written_into: "ADR `## Consequences` under `**Strategic follow-up:**`"
    consumed_by: consultant
    meaning: "A tactical request raised a strategic question."

  - token: "[TACTICAL DESIGN NEEDED]"
    produced_by: consultant
    written_into: "SDR `## Tactical follow-up`"
    consumed_by: architect
    meaning: "A ratified strategic decision needs tactical design."

  - token: "ARCHITECT AMENDMENT NEEDED:"
    produced_by: "reviewer; team lead (attached)"
    written_into: "Per-phase review output — summary line above the verdict (orthogonal to APPROVED/CHANGES REQUIRED); or the head of a team-lead amendment request."
    consumed_by: architect
    meaning: "The governing design artifacts (design record, or legacy ADR/plan pair) need architect attention."
    note: >-
      One meaning, three legal emission conditions — the architect's M2a classifies which:
      (1) reviewer-recorded ADR drift; (2) team-lead-attached user/PO ruling changing an
      existing decision; (3) reviewer-detected plan defect (criterion too ambiguous to
      verify, or phase over the alignment-table cap). All three mean "revise the governing
      artifacts" — never "fix the code" (that is CHANGES REQUIRED's job).

  - token: "## Phase N Complete"
    produced_by: developer
    written_into: "Phase summary heading (implement.md Output format)"
    consumed_by: "team lead (routes to user for approval; to reviewer at checkpoints); reviewer mode dispatch"
    meaning: "A phase is implemented, verified, and awaiting the user's `approved`."

  - token: "## All Phases Complete"
    produced_by: developer
    written_into: "End-of-plan summary heading (implement.md Output format)"
    consumed_by: "team lead (routes to reviewer); reviewer mode dispatch (cumulative branch)"
    meaning: "Every phase is approved; the plan awaits its one cumulative review."

  - token: "## Phase N Stalled"
    produced_by: developer
    written_into: "Stall block heading at the 3-rejection bound (rejection.md Output format)"
    consumed_by: "team lead (surfaces the user decision; SHOULD offer a fresh-eyes developer respawn — instructions/lead/orchestration.md ## Agent lifecycle)"
    meaning: "Three rejections of the same phase; a user decision is required to proceed."

  - token: "SELF_CHECKED"
    produced_by: architect
    written_into: "architect output — final summary line in Design mode when NO A13 threshold tripped (phases ≤3, no security path, no [IRREVERSIBLE] step, no schema/migration work); the Thresholds: line shows the arithmetic"
    consumed_by: "developer pre-flight (satisfies the phase-1 'prior' check when no ALIGNED exists — preflight.yaml#developer-implement)"
    meaning: "Architect performed the five-check self-verification and no cross-check threshold tripped, so no reviewer pass runs before Phase 1. The cumulative review still runs."

  - token: "SELF_CHECKED (delta)"
    produced_by: architect
    written_into: "Amendment output — final line when NO M5a condition holds (trigger USER_DIRECTED, <2 revision-log entries, ≤2 decisions revised, no security path)"
    consumed_by: "(none — informational; signals the post-amendment delta re-check was waived)"
    meaning: "A user-directed, low-churn amendment skips the reviewer's delta re-check. Reviewer-driven drift never qualifies, and record churn (≥2 prior amendments) re-arms the gate."

  - token: "CROSS_CHECK_REQUESTED:"
    produced_by: architect
    written_into: "architect output — the Design-mode final line when an A13 threshold tripped, AND the Amendment-mode final line when an M5a condition holds. Carries the record/plan path, the tripped condition(s), and (amendment) the delta scope as a D-### list."
    consumed_by: reviewer
    meaning: "Architect requests an external cross-check pass. Fresh designs get a full pass; amendments after a prior ALIGNED get a delta-scoped pass (reviewer CC-2)."
    note: >-
      Named exception to "one token = one meaning": this token carries one request
      (run a cross-check); the SCOPE (full vs delta) is deliberately NOT a token
      variant — it is resolved deterministically by the reviewer at CC-2 from the
      request's scope clause (or legacy ADR filename) + its own memory, so a
      mis-labelled request cannot shrink the pass.

  - token: "CYCLE BOUND REACHED:"
    produced_by: reviewer
    written_into: "Review or cross-check output — its own summary line ABOVE the verdict line, alongside ARCHITECT AMENDMENT NEEDED:. Orthogonal to the verdict, which still renders normally."
    consumed_by: "team lead (surfaces the user decision; must NOT route another round of the same loop unattended)"
    meaning: "The same gate has returned the same rejecting verdict N times for this plan without converging. A user decision is required before another cycle."
    note: >-
      MAST R7 ("detect and break repetition loops; cap iterations"). Two loops
      had no cap at all: the end-of-plan cumulative review (CHANGES REQUIRED →
      fix → fresh ## All Phases Complete, specified as running "until APPROVED
      clears") and the cross-check/amendment cycle (DRIFT DETECTED → amendment →
      re-check → drift again). The developer's 3-rejection bound covers neither,
      because it counts rejections of a PHASE. The reviewer counts these from its
      own memory index — the data it already writes at perphase step 16 and
      crosscheck CC-6 — so no new bookkeeping exists to fall out of date.
      The architect's r3 consolidation (amendment.md M2b) is NOT this: it changes
      the ADR's shape, it does not break the loop.

  - token: "PAUSED"
    produced_by: "any named agent"
    written_into: "First line of the turn, as `PAUSED — <reason>` plus the question(s) (CLAUDE.md ## Turn discipline)"
    consumed_by: "team lead (surfaces the question to the user; relays the answer as a continuation turn)"
    meaning: "The agent stopped mid-contract and needs an answer before it can finish. The only legal way to end a turn without the mode's output block."
    note: >-
      Load-bearing in the enforcement layer, not just in prose: guard.verdict.mjs
      exits 0 on any turn whose text starts a line with `PAUSED`, so this token
      bypasses every verdict, classification, and routing-line check. That is
      intended — a paused turn has no block to validate — but it makes the exact
      spelling a security-relevant contract, not a stylistic one.

  - token: "RECONCILE WITH ADR:"
    produced_by: architect
    written_into: "Amendment output — emitted only on CODE_DRIFT classification"
    consumed_by: developer
    meaning: "Code drifted from a still-correct ADR. Developer restores the named decisions; treated as a rejection (counts toward 3-rejection bound)."
