# Test and linter detectors for the developer agent (step 7).
# Loaded on demand. First match wins per category.
# Replaces the inline cascade in developer.md — keeps the agent prompt lean.

log_digest:
  why: "A build/test log is thousands of lines; pasted into a phase context it crowds out the work."
  how: "<command> > .claude/state/phase-<N>.log 2>&1; echo \"exit=$?\"  then  node .claude/scripts/logdigest.mjs <log>"
  returns: "verdict (certain when the exit= marker is present, else inferred), summary lines, deduplicated failures with file:line, WARN bucket capped at 5 with npm funding/peer-dep noise dropped, tail when clean. Full log stays on disk to grep."
  rule: "Redirect the command yourself — never wrap it. A wrapper hides the real command from guard.bash's destructive-command classification and from observe.bash's drive/inspect classification; saving context is not worth blinding the security classifier."

test_detectors:
  - { signal: "package.json with a `test` script",                command_via: "npm test" }
  - { signal: "Makefile with a `test` target",                    command_via: "make test" }
  - { signal: "pytest.ini OR pyproject.toml [tool.pytest]",        command_via: "pytest" }
  - { signal: "go.mod present AND any *_test.go file",            command_via: "go test ./..." }
  - { signal: "Cargo.toml",                                       command_via: "cargo test" }
  - { signal: "build.gradle OR build.gradle.kts",                 command_via: "./gradlew test" }
  - { signal: "pom.xml",                                          command_via: "mvn test" }
  - { signal: "CMakeLists.txt containing `enable_testing()`",     command_via: "ctest" }
  - { signal: "deno.json with a `test` task",                     command_via: "deno test" }
  - { signal: "any *.spec.ts or *.test.ts in changed paths",      command_via: "vitest run OR jest" }
  - { signal: "no match",                                         command_via: "note 'no test suite detected'" }

lint_detectors:
  - { signal: "package.json with a `lint` script",                command_via: "npm run lint" }
  - { signal: "biome.json OR biome.jsonc",                        command_via: "biome check" }
  - { signal: ".eslintrc* OR eslint.config.*",                    command_via: "eslint" }
  - { signal: "ruff.toml OR [tool.ruff] in pyproject.toml",        command_via: "ruff check" }
  - { signal: ".flake8 OR setup.cfg [flake8]",                    command_via: "flake8" }
  - { signal: ".golangci.yml OR .golangci.yaml",                  command_via: "golangci-lint run" }
  - { signal: "Cargo.toml AND `clippy` enabled",                  command_via: "cargo clippy" }
  - { signal: "Makefile with a `lint` target",                    command_via: "make lint" }
  - { signal: "no match",                                         command_via: "note 'no linter detected'" }

failure_handling:
  test: "For each failing test, check against base via the stash dance: `git stash --include-untracked && <test> && git stash pop`. Also fails on base → tag [PRE-EXISTING], not blocking. Otherwise fix in this phase."
  linter: "Linter failures introduced this phase must be fixed. Pre-existing may be tagged [PRE-EXISTING]."

# How to boot/drive the changed flow for the verification loop (implement.md
# step 7a). First match wins. Starting an app, worker, or container and hitting
# an endpoint are MUTATING actions — surface the exact command(s) for
# confirmation once per phase, or rely on the project's settings allowlist.
# Projects SHOULD allowlist their standard run/drive commands so verification
# needs no prompt.
run_detectors:
  - { signal: "changed project has launchSettings.json OR a Program.cs entry point", drive_via: "dotnet run --project <csproj> (or the project's documented run task); hit the endpoint with curl/httpie" }
  - { signal: "package.json with a `dev` or `start` script",                          drive_via: "npm run dev | npm start; hit the endpoint or exercise the CLI" }
  - { signal: "docker-compose*.yml defining the touched service",                     drive_via: "docker compose up <service>; observe logs + endpoint" }
  - { signal: "worker / background service (hosted service, cron, consumer)",         drive_via: "run the host process; observe its log output for one cycle (or trigger one message)" }
  - { signal: "CLI tool or script",                                                   drive_via: "invoke the command with representative args; observe stdout/exit code" }
  - { signal: "no match",                                                             drive_via: "record 'no drivable surface' — allowed ONLY under the step-7a exemption rules" }

verification_rules:
  evidence: "Verified means OBSERVED at runtime — a command you ran and output you saw. Reading the code again is not verification. Cite the command and the observed result (trimmed) in the phase summary."
  data_safety: "Driving a mutating endpoint or flow runs against dev/local data only; if only shared data is reachable, surface before driving."
  blocked: "If the flow cannot boot in this environment (missing DB, secrets, license), record 'not drivable in this environment — <blocker>' in the summary and surface it. Never fake or infer verification."
  observed: >-
    The claim is machine-checked. hooks/observe.bash.mjs records every Bash command and classifies it
    three ways: INSPECT (git queries, rg/cat/ls), NEUTRAL (build, test, lint, format, and version-control
    bookkeeping), or DRIVE (everything else). Only DRIVE counts as evidence — running the suite and
    committing the phase are mandatory and prove nothing about the runtime surface, which is the whole
    point of step 7a. guard.verdict blocks a phase summary when the Verification field claims a drive and
    either (a) it does not follow the `<command driven> → <observed result>` form, or (b) no drive-class
    command was observed for that phase. Both exemption forms pass without evidence, so state the
    exemption rather than describing a drive that did not happen.
