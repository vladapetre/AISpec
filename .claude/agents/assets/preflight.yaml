# Pre-flight semantics registry.
# Each agent's step-2 pre-flight references this file by key instead of restating.
# Entry-turn rule, the ✓/⚠/✗ branch, and the two universal rules live in
# CLAUDE.md ## Pre-flight protocol. The FORMATS below live here rather than there:
# every agent loads this file at step 2 anyway, so a copy in the always-on file
# would be paid by every session and read by none.

emit_format:
  compact: "Pre-flight: Inputs ✓ | Prior N/A | Scope ✓ | Terms ✓ | Target ✓ → PROCEED"
  compact_when: "every check is ✓ or N/A — one line, then proceed."
  expanded_when: "at least one check is ⚠ or ✗ — per-line evidence, then a Result line."
  expanded: |
    Pre-flight:
    - Inputs exist: <✓|⚠|✗>  <one-line evidence>
    - Prior phase reviewed: <✓|⚠|✗|N/A>  <one-line evidence>
    - Scope: <✓|⚠|✗>  <one-line evidence>
    - Terms current: <✓|⚠|✗>  <one-line evidence>
    - Target identified: <✓|⚠|✗>  <one-line evidence>

    Result: <ASK | STOP>
  ask_grammar: "Up to 5 questions in ONE batch, each ≤2 lines and ≤25 words: `Q<n>: <question> [Default: <fallback> | none]`. The default names the assumption the agent falls back on if unanswered; `none` when no defensible default exists."

# Key = the agent's `name:` frontmatter value. Multi-mode agents have one entry
# per mode-specific file (e.g. architect-design, architect-amendment).

analyst:
  inputs: "every named source (paths, URLs, inline data, Jira keys/JQL) is reachable"
  prior: "N/A — pipeline entry"
  scope: "analysis or ticketing-platform interaction (pull/create/update); not design or review"
  terms: "domain terms appear in .claude/MEMORY.md or are the user's wording; unfamiliar coined terms get ⚠"
  target: "source uniquely referenced; never 'the recent codebase' or 'the latest report'. Vague scope → ⚠ and ask which subtree or entry points. For ticket creation, the destination project + issue type is named or asked"

architect-design:
  inputs: "optional framing report; any cited SDR"
  prior: "N/A"
  scope: "no strategic ratification, no production code"
  terms: "domain terms appear in .claude/MEMORY.md, a charter/SDR, or an existing ADR"
  target: "bounded context and design subject named"

architect-amendment:
  inputs: "reviewer's ## Phase Review block (or the queued-ruling list), the target file in artifacts/plans/, the named D-### sections, every cited file:line"
  prior: "reviewer's verdict is present"
  scope: "no strategic ratification, no production code"
  terms: "domain terms appear in .claude/MEMORY.md, a charter/SDR, or an existing design record/ADR"
  target: "record/plan name, phase number, and the decision(s) under amendment explicitly named — never 'the last plan' or an inferred phase"

consultant-discussion:
  inputs: "any artifact the user names (analyst report, tactical ADR, existing charter/SDR/context map) is at its path"
  prior: "N/A"
  scope: "not purely tactical. Purely tactical request → step-3 redirect"
  terms: "domain terms appear in .claude/MEMORY.md or are the user's wording"
  target: "affected bounded context(s) named or unambiguous"

consultant-artifact:
  inputs: "the write-set inputs: any cited analyst report, ADR with [STRATEGIC REVIEW NEEDED], existing charter/SDR/context map being updated"
  prior: "N/A"
  scope: "not purely tactical"
  terms: "domain terms appear in .claude/MEMORY.md or are the user's wording"
  target: "affected bounded context(s) named or unambiguous; the specific artifact(s) to write are explicit"

developer-implement:
  inputs: "plan file (design record, or legacy plan + its governing ADR), project config for test/lint detection. Plan header carries **Spec: ON HOLD** → ⚠ and ask; never implement against a held plan"
  prior: "phase 1: cross-check ALIGNED (or N/A if architect emitted SELF_CHECKED; SELF_CHECKED (delta) satisfies this only in the pre-Phase-1 amendment case — e.g. a plan amended under a spec hold before implementation started). Phase N>1: prior phase carries **Status: Complete** (verify via plan-status.mjs check)"
  scope: "implementing exactly one phase"
  terms: "every term in the phase's acceptance criteria appears in the plan file, its decision source (record ## Decisions, or legacy ADR), or .claude/MEMORY.md"
  target: "exactly one phase number; plan filename explicit"

developer-rejection:
  inputs: "the feedback itself (reviewer verdict block, RECONCILE WITH ADR: list, or the user's rejection text), plan file (+ legacy governing ADR when the plan carries the pointer)"
  prior: "the rejected phase's ## Phase N Complete summary exists in-conversation (feedback without a phase summary → ⚠ and ask what is being rejected)"
  scope: "addressing feedback on the current phase only — no new-phase work, no future-phase work"
  terms: "every term in the phase's acceptance criteria appears in the plan file, its decision source (record ## Decisions, or legacy ADR), or .claude/MEMORY.md"
  target: "phase number and feedback source (user | reviewer | architect) both unambiguous"

reviewer-perphase:
  inputs: "developer summary in request; plan at its path; decision source resolvable per step 7 (record ## Decisions, or legacy governing ADR)"
  prior: "phase 1: N/A. Phase N>1: prior phase carries **Status: Complete** (verify via plan-status.mjs check, not by eye)"
  scope: "review only; no feature suggestions"
  terms: "acceptance criteria use terms found in the plan file, its decision source, or .claude/MEMORY.md"
  target: "explicit phase number and resolvable commit range. Never 'the latest change'"

reviewer-crosscheck:
  inputs: "target path under artifacts/plans/; decision source resolves (## Decisions section, or legacy governing ADR with readable ## Context)"
  prior: "N/A"
  scope: "artifact-consistency only, no code review"
  terms: "decisions and phases share domain language"
  target: "one design record, or (legacy) one plan + one ADR"
