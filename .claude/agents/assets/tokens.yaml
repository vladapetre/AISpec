# Token vocabulary index. Load only the file you need.
#
# All routing physically passes through the team lead (star topology). Agent files
# reference these entries by token; they do not restate them.

vocabulary_rules:
  - One token = one meaning. Do not overload.
  - Producers write tokens only into the artifact section named in the registry — never free-floating, except designated summary lines.
  - Consumers scan for their tokens at a fixed step of every invocation.
  - Adding a token requires adding an entry in the matching file first.
  - Verdict tokens are matched as exact strings. Near-matches are rejections.
  - Identifier prefixes are matched as `<prefix>-<n>` patterns; assignment and stability rules in `tokens.markers.yaml#identifier_rules`.

files:
  routing:   tokens.routing.yaml    # cross-agent handoff tokens
  verdicts:  tokens.verdicts.yaml   # gate decisions (APPROVED, ALIGNED, approved, ...)
  markers:   tokens.markers.yaml    # in-artifact annotations + identifier prefixes

# Quick lookup — token → file. Agents resolve by token name, then load the matching file.
quick_lookup:
  "[ARCHITECT REVIEW NEEDED]":   routing
  "ARCHITECT REVIEW NEEDED:":    routing
  "[CONSULTANT REVIEW NEEDED]":  routing
  "STRATEGIC REVIEW NEEDED:":    routing
  "[STRATEGIC REVIEW NEEDED]":   routing
  "[TACTICAL DESIGN NEEDED]":    routing
  "ARCHITECT AMENDMENT NEEDED:": routing
  "## Phase N Complete":         routing
  "## All Phases Complete":      routing
  "## Phase N Stalled":          routing
  "SELF_CHECKED":                routing
  "SELF_CHECKED (delta)":        routing
  "CROSS_CHECK_REQUESTED:":      routing
  "RECONCILE WITH ADR:":         routing
  "APPROVED":                    verdicts
  "CHANGES REQUIRED":            verdicts
  "approved":                    verdicts
  "ALIGNED":                     verdicts
  "DRIFT DETECTED":              verdicts
  "[IRREVERSIBLE]":              markers
  "[PRE-EXISTING]":              markers
  "[VERIFIED]":                  markers
  "[INFERRED]":                  markers
  "[ASSUMED]":                   markers
  "[ASSUMPTION]":                markers
  "[UNKNOWN]":                   markers
  "[withdrawn]":                 markers
  "<!-- status:phase-N -->":     markers
  "**Status: Complete**":        markers
  "**Spec: ON HOLD**":           markers
  "**Supersedes:**":             markers
  "**Superseded by:**":          markers
  "**Consolidates:**":           markers
