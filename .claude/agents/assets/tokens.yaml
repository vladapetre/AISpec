# Handoff-token vocabulary — single source of truth.
# All routing physically passes through the team lead (star topology).
# Agent files reference entries here; they do not restate them.

vocabulary_rules:
  - One token = one meaning. Do not overload.
  - Producers write tokens only into the artifact section named below — never free-floating, except designated summary lines.
  - Consumers scan for their tokens at a fixed step of every invocation.
  - Adding a token requires adding an entry here first.
  - Verdict tokens are matched as exact strings. Near-matches are rejections.
  - Identifier prefixes are matched as `<prefix>-<n>` patterns; assignment and stability rules in identifier_rules below.

# --- Routing tokens: move work between agents ---
# Disambiguation: analyst's report-side and architect's ADR-side flags both use the
# "ARCHITECT REVIEW NEEDED" wording but in different artifacts. In-artifact form is
# bracketed `[...]`; conversation form is the summary-line prefix `...:`.
routing_tokens:
  - token: "[ARCHITECT REVIEW NEEDED]"
    summary_line: "ARCHITECT REVIEW NEEDED:"
    produced_by: analyst
    written_into: "Report Recommendations + summary line"
    consumed_by: architect
    meaning: "A finding needs tactical architectural input."

  - token: "[CONSULTANT REVIEW NEEDED]"
    summary_line: "STRATEGIC REVIEW NEEDED:"
    produced_by: analyst
    written_into: "Report Recommendations + summary line"
    consumed_by: consultant
    meaning: "A finding needs strategic input."

  - token: "[STRATEGIC REVIEW NEEDED]"
    produced_by: architect
    written_into: "ADR `## Consequences` under `**Strategic follow-up:**`"
    consumed_by: consultant
    meaning: "A tactical request raised a strategic question."

  - token: "[TACTICAL DESIGN NEEDED]"
    produced_by: consultant
    written_into: "SDR `## Tactical follow-up`"
    consumed_by: architect
    meaning: "A ratified strategic decision needs tactical design."

  - token: "ARCHITECT AMENDMENT NEEDED:"
    produced_by: reviewer
    written_into: "Per-phase review output — summary line above the verdict. Orthogonal to APPROVED/CHANGES REQUIRED."
    consumed_by: architect
    meaning: "Phase diff drifted from the governing ADR; architect must amend."

  - token: "SELF_CHECK: ALIGNED"
    produced_by: architect
    written_into: "Mode A output — final summary line by default"
    consumed_by: "(none — informational; signals no cross-check needed)"
    meaning: "Architect performed the five-check self-verification and the ADR/plan pair is internally consistent."

  - token: "CROSS_CHECK_REQUESTED:"
    produced_by: architect
    written_into: "Mode A output — replaces SELF_CHECK: ALIGNED when uncertainty exists. Carries plan path and one-line reason."
    consumed_by: reviewer
    meaning: "Architect requests an external cross-check pass before the developer is invited."

  - token: "RECONCILE WITH ADR:"
    produced_by: architect
    written_into: "Amendment-mode output — emitted only on CODE_DRIFT classification"
    consumed_by: developer
    meaning: "Code drifted from a still-correct ADR. Developer restores the named decisions; treated as a rejection (counts toward 3-rejection bound)."

# --- Verdict tokens: gate decisions. Matched as exact strings ---
# Phase-approval gate: every phase needs the user's `approved`. Reviewer's APPROVED is
# cumulative at end-of-plan unless the user asks for ad-hoc per-phase review.
# Cross-check gate fires once per ADR/plan pair before Phase 1 (only if architect
# escalated via CROSS_CHECK_REQUESTED — default is SELF_CHECK: ALIGNED).
verdict_tokens:
  - token: "APPROVED"
    issued_by: reviewer
    gate: "end-of-plan cumulative review (or ad-hoc per-phase if user requested)"
    effect: "Phase / plan passes the reviewer gate."

  - token: "CHANGES REQUIRED"
    issued_by: reviewer
    gate: "end-of-plan cumulative review (or ad-hoc per-phase if user requested)"
    effect: "Phase / plan returns to the developer."

  - token: "approved"
    match: case-insensitive
    issued_by: "user (relayed by team lead)"
    gate: "phase-approval gate — every phase"
    effect: "Developer advances to the next phase."

  - token: "ALIGNED"
    issued_by: reviewer
    gate: "cross-check gate (only if architect escalated via CROSS_CHECK_REQUESTED)"
    effect: "ADR/plan pair is mutually consistent; developer may start Phase 1."

  - token: "DRIFT DETECTED"
    issued_by: reviewer
    gate: "cross-check gate (only if architect escalated via CROSS_CHECK_REQUESTED)"
    effect: "ADR/plan pair has critical/major cross-artifact drift; architect reconciles via amendment."

# --- In-artifact markers: status / quality annotations, not routing ---
in_artifact_markers:
  - "<!-- status:phase-N --> — architect writes the per-phase anchor in plan files."
  - "**Status: Complete** — developer inserts after a phase anchor on user approval."
  - "[IRREVERSIBLE] — architect/consultant mark hard-to-reverse decisions; triggers extra user confirm."
  - "[PRE-EXISTING] — developer/reviewer mark failures/findings not introduced by the current phase; excluded from verdict."
  - "[VERIFIED] / [INFERRED] / [ASSUMED] — analyst per-finding confidence markers (definitions in documenting SKILL.md)."
  - "[ASSUMPTION] — analyst coverage/scoping caveat in Risks and Unknowns."
  - "[UNKNOWN] — analyst: a required question left unanswered after full ingestion."
  - "[withdrawn] — appended to an ID-led line whose entry no longer applies. ID stays in place — never re-number."

# --- Identifier prefixes: typed cross-artifact ID vocabulary ---
# Cross-artifact references take the form `<short-title>#<ID>` where `<short-title>` is
# the host filename without `.md` (and, for ADRs/SDRs, without the numeric prefix).
# Examples: auth-audit#R-007, event-store#D-002, payments-rewrite#T-2.3.
identifier_prefixes:
  - { prefix: "R-",    format: "R-###",          produced_by: analyst,             host: "reports/<title>.md",            in: "Each finding bullet in `### theme` subsection. Severity-tagged." }
  - { prefix: "D-",    format: "D-###",          produced_by: "architect, consultant", host: "adr/, strategy/decisions/", in: "Sub-decision heading/bullet in `## Decision` (use only when artifact has multiple decisions)." }
  - { prefix: "RISK-", format: "RISK-###",       produced_by: "architect, consultant", host: "adr/, strategy/decisions/", in: "`## Consequences > Risks` bullets. Severity-tagged." }
  - { prefix: "T-",    format: "T-<phase>.<seq>", produced_by: architect,           host: "plans/<title>.md",              in: "Bullets under each phase's `**Done when:**`. Phase-namespaced so adding/removing phases does not renumber unrelated phases." }
  - { prefix: "OQ-",   format: "OQ-###",         produced_by: "architect, consultant", host: "plans/, charters/",         in: "`## Open Questions` / `## Open questions` bullets." }
  - { prefix: "TF-",   format: "TF-###",         produced_by: consultant,           host: "strategy/decisions/",           in: "`## Tactical follow-up` bullets, each led by `**TF-###** [TACTICAL DESIGN NEEDED]`. Architect cites these in tactical ADR `## Context`." }
  - { prefix: "INV-",  format: "INV-###",        produced_by: consultant,           host: "strategy/charters/",            in: "`## Invariants` bullets. Cited by SDRs constraining the context and by reviewers checking design-intent alignment." }
  - { prefix: "REL-",  format: "REL-###",        produced_by: consultant,           host: "strategy/context-maps/",        in: "First column of `## Relationships` rows. Cited by SDRs changing the relationship pattern." }
  - { prefix: "X-",    format: "X-###",          produced_by: reviewer,             host: "(conversation channel only)",   in: "Cross-check output table. Resets per pass — IDs do not survive across passes. Severity-tagged." }

identifier_rules:
  - "Assign IDs in encounter order at first write; dense at first write, sparse after edits."
  - "Never re-number a published ID. Withdraw by appending `[withdrawn]`."
  - "Amending an artifact: next integer after the high-water mark — never reuse withdrawn numbers."
  - "Cross-artifact refs: `<short-title>#<ID>` (short-title = host filename without `.md`, without numeric prefix for ADRs/SDRs)."
  - "Severity-tagged prefixes carry `[critical | major | minor | pre-existing]` in brackets after the ID — values per the template's severity table, never paraphrased."
