# Closing self-check registry.
# Each agent ends its <instructions> with: "Closing self-check per assets/selfcheck.yaml#<key>."
# Every box must tick before the agent emits.
#
# Keys: <agent> (single-mode) or <agent>-<mode> (multi-mode). Multi-mode keys inherit the
# `_universal` block plus the agent's `_base` block, then add their mode-specific boxes.
# An agent's <output_format> rendering is FM-3.1; memory write is FM-3.4; scope discipline
# is FM-1.2 — these are universal and stated once here.

_universal:
  - { fm: FM-1.2, check: "Stayed inside <decision_authority> — no out-of-scope work." }
  - { fm: FM-3.1, check: "<output_format> block fully rendered; required fields populated." }
  - { fm: FM-3.4, check: "Memory entry written per the active template / role rule." }
  - { fm: FM-3.4, check: "Index entry within cap (≤2 lines / ≤50 words); no fact duplicated between MEMORY.md and an entity file or artifact; only registered memory file kinds written." }

analyst:
  - { fm: FM-1.2, check: "Described, did not design or prescribe solutions." }
  - { fm: FM-1.2, check: "Any mutating ticket action (create/edit/transition/comment/link) was surfaced and user-confirmed before execution; read-only pulls need no confirmation." }
  - { fm: FM-1.3, check: "Every required model question is answered or surfaced as [UNKNOWN]." }
  - { fm: FM-3.3, check: "Every finding carries exactly one confidence marker; [VERIFIED] only for directly observed." }
  - { fm: FM-2.4, check: "Every finding meeting step-10 criteria carries the right flag and the matching summary line is emitted." }

architect:
  _base:
    - { fm: FM-1.2, check: "No code, no strategic ratification." }
architect-design:
  - { fm: FM-1.3, check: "SELF_CHECKED or CROSS_CHECK_REQUESTED line present per A13." }
  - { fm: FM-1.1, check: "A9b assumption gate ran: every load-bearing [INFERRED]/[ASSUMED] premise about existing schema/data/legacy behaviour was verified or downgraded to a plan [UNKNOWN] with a named fallback; no acceptance criterion silently rests on an [ASSUMED] finding." }
  - { fm: FM-2.4, check: "Every blocking [STRATEGIC REVIEW NEEDED] emitted where step rules require it." }
  - { fm: FM-3.1, check: "Exactly 2 binding constraints; exactly 2 alternatives (or _None identified_); single recommended design." }
architect-amendment:
  - { fm: FM-1.1, check: "Surgical context only — no full-ADR, full-plan, or full-file re-reads (Security paths excepted; a M3b consolidation reads its whole chain by design)." }
  - { fm: FM-2.4, check: "RECONCILE WITH ADR: emitted (CODE_DRIFT) or supersession ADR written (ADR_AMENDED / PLAN_UPDATED)." }
  - { fm: FM-2.4, check: "Revision budget checked (M2b): existing -r* siblings counted; r1/r2 append a delta, the third amendment onward consolidates (M3b) and stamps every file in the chain." }
  - { fm: FM-1.2, check: "A batched user-ruling flush produced ONE supersession ADR covering every queued ruling — not one per ruling." }
  - { fm: FM-2.4, check: "M5a routing line present: CROSS_CHECK_REQUESTED (default) or SELF_CHECKED (delta) with all four carve-out conditions genuinely held; trigger source classified." }
  - { fm: FM-3.1, check: "Classification line is exactly one of CODE_DRIFT / ADR_AMENDED / PLAN_UPDATED." }

consultant:
  _base:
    - { fm: FM-1.2, check: "Stayed strategic: no tactical detail, no code, no API shape." }
    - { fm: FM-2.4, check: "Right mode dispatched; redirect line emitted for purely tactical requests." }
consultant-discussion:
  - { fm: FM-1.3, check: "Strategic question framed sharply; recommendation given; blocking unknowns named." }
  - { fm: FM-3.2, check: "Every alternative states what is gained AND what is sacrificed; [IRREVERSIBLE] items marked." }
  - { fm: FM-3.4, check: "Every new or overloaded term this turn exists in .claude/MEMORY.md ## Language or was added; each crystallised decision logged as ≤3 sentences + pointer to its owning artifact (detail with no artifact home → that signals writing the SDR, not inlining it)." }
consultant-artifact:
  - { fm: FM-3.4, check: "Memory entry written per touched template." }

developer:
  _base:
    - { fm: FM-1.2, check: "Code matches craftsmanship charter: names carry meaning, no cleverness tax, no dead weight, idiomatic to the stack." }
    - { fm: FM-1.1, check: "Every touched file was read first." }
developer-implement:
  - { fm: FM-1.3, check: "This phase only; no future-phase work." }
  - { fm: FM-3.3, check: "Tests and linter ran (or absence noted); introduced failures fixed; pre-existing tagged [PRE-EXISTING]." }
  - { fm: FM-3.3, check: "Step 7a verification ran: the changed flow was DRIVEN and the result OBSERVED (command + output cited), or the Verification field carries an honest exemption/blocker — never verification inferred from reading code, and config/DI/startup wiring is never exempt." }
  - { fm: FM-3.1, check: "<output_format> block fully rendered; pushed-back items and decisions listed." }
  - { fm: FM-3.4, check: "On approval, plan-progress memory updated." }
developer-rejection:
  - { fm: FM-2.4, check: "Feedback classified (craft / structural / grey zone); right escalation taken." }
  - { fm: FM-3.3, check: "Tests and linter re-ran after fix; introduced failures fixed." }
  - { fm: FM-3.1, check: "Fresh phase summary emitted, or stalled block at 3-rejection bound." }

reviewer:
  _base:
    - { fm: FM-1.2, check: "Stayed inside <decision_authority>: no fixes, no redesigns, no features." }
    - { fm: FM-1.3, check: "Every <output_format> field rendered; UNCLEAR rows surfaced." }
reviewer-perphase:
  - { fm: FM-2.4, check: "Amendment flag emitted whenever step 11 recorded drift, independent of verdict." }
  - { fm: FM-1.3, check: "Step 11b removed-guard check ran: every deleted/weakened guard, filter, or validation maps to a criterion mandating its removal, or is a finding." }
  - { fm: FM-1.3, check: "Cumulative only — step 11a cross-flow impact analysis run; consumers of changed shared logic traced; undocumented behaviour-shifting ripples flagged with both change and consumer file:line, and section 2b rendered. (Per-phase: N/A.)" }
  - { fm: FM-3.1, check: "Verdict is one of the two exact strings on its own line; amendment flag (if any) on its own line above it." }
  - { fm: FM-3.3, check: "Every finding cites file:line; pre-existing findings tagged and excluded." }
  - { fm: FM-3.3, check: "Evidence bar held (SKILL.md ## Evidence bar): each finding survived an active attempt to disprove it; every Critical/Major carries a concrete failure scenario or was demoted; Minor capped at 5 with the remainder as a count." }
  - { fm: FM-1.2, check: "Machine-enforced set resolved and recorded on the Machines: line; no finding reported that this project's own gates already fail on — but a guard's OWN code was still reviewed." }
reviewer-crosscheck:
  - { fm: FM-3.1, check: "Final line is exactly ALIGNED or DRIFT DETECTED; cross-check table rows ≤30 (delta: ≤10)." }
  - { fm: FM-3.3, check: "Every row cites the artifact location it checks." }
  - { fm: FM-1.1, check: "Scope line matches the CC-2 resolution (delta only when supersession ADR + prior ALIGNED for the same plan); delta pass read only the revised/edited sections." }
  - { fm: FM-3.4, check: "Memory write followed CC-6: clean pass → index line only; findings-bearing pass → review-<plan-stem>-crosscheck[-rN]-<date>.md plus index line." }
